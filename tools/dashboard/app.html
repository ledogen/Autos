<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AUTOS — planning dashboard</title>
<style>
  :root {
    --bg:#14161a; --panel:#1b1e24; --panel2:#22262e; --line:#2c313b;
    --fg:#dfe3ea; --dim:#8b94a3; --dimmer:#646c7a;
    --accent:#6fb3ff;
    --feature:#6fb3ff; --bug:#ff7a7a; --perf:#ffc25c; --quality:#b78bff;
    --infra:#5fd0c0; --asset:#7fd97f; --unknown:#8b94a3; --milestone:#ff9ad5;
    --critical:#ff5c5c; --high:#ff8a5c; --major:#ffc25c;
    --medium:#9fd06f; --minor:#6a7382; --trivial:#4d545f;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }

  header {
    position:sticky; top:0; z-index:10; background:var(--panel);
    border-bottom:1px solid var(--line); padding:10px 18px;
    display:flex; gap:14px; align-items:center; flex-wrap:wrap;
  }
  .brand { font-weight:600; letter-spacing:.3px; margin-right:4px; }
  .brand span { color:var(--dimmer); font-weight:400; }
  nav a {
    padding:4px 10px; border-radius:6px; color:var(--dim);
  }
  nav a.on { background:var(--panel2); color:var(--fg); }
  nav a:hover { text-decoration:none; color:var(--fg); }
  #search {
    margin-left:auto; background:var(--bg); border:1px solid var(--line);
    color:var(--fg); border-radius:6px; padding:5px 10px; width:260px; font:inherit;
  }
  #search:focus { outline:none; border-color:var(--accent); }
  button.act {
    background:var(--panel2); border:1px solid var(--line); color:var(--dim);
    border-radius:6px; padding:5px 10px; font:inherit; cursor:pointer;
  }
  button.act:hover { color:var(--fg); border-color:var(--dimmer); }

  main { max-width:1080px; margin:0 auto; padding:18px; }

  /* filters */
  .filters { display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .frow { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .flabel { color:var(--dimmer); font-size:11px; text-transform:uppercase;
            letter-spacing:.8px; width:62px; flex:none; }
  .chip {
    border:1px solid var(--line); background:transparent; color:var(--dim);
    border-radius:999px; padding:3px 11px; font:inherit; font-size:12.5px;
    cursor:pointer; display:flex; gap:6px; align-items:center;
  }
  .chip .n { color:var(--dimmer); font-size:11px; font-variant-numeric:tabular-nums; }
  .chip:hover { border-color:var(--dimmer); color:var(--fg); }
  .chip.on { color:#12151a; background:var(--fg); font-weight:600; border-color:transparent; }
  .chip.on .n { color:rgba(0,0,0,.5); }
  .chip .dot { width:7px; height:7px; border-radius:50%; background:currentColor; }

  /* list */
  .count { color:var(--dimmer); font-size:12px; margin:2px 0 8px; }
  ul.list { list-style:none; margin:0; padding:0;
            border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  ul.list li {
    display:flex; gap:12px; align-items:baseline; padding:7px 12px;
    border-bottom:1px solid var(--line);
  }
  ul.list li:last-child { border-bottom:0; }
  ul.list li:nth-child(even) { background:rgba(255,255,255,.015); }
  ul.list li:hover { background:var(--panel2); }
  .tid { font-family:var(--mono); font-size:12.5px; width:92px; flex:none; }
  .ttitle { flex:none; max-width:44%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tblurb { color:var(--dimmer); font-size:12.5px; overflow:hidden;
            text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .tmeta { margin-left:auto; flex:none; display:flex; gap:8px; align-items:center;
           font-size:11px; color:var(--dimmer); }
  .sev { font-family:var(--mono); font-size:10.5px; text-transform:uppercase;
         letter-spacing:.5px; }
  .st { font-size:10.5px; border:1px solid var(--line); border-radius:4px; padding:0 5px; }
  .st.closed, .st.cancelled { opacity:.6; }

  /* detail */
  .crumb { color:var(--dimmer); font-size:12px; margin-bottom:10px; }
  .dhead { display:flex; gap:12px; align-items:flex-start; margin-bottom:6px; }
  .dhead h1 { font-size:21px; margin:0 0 2px; line-height:1.3; }
  .dhead .id { font-family:var(--mono); color:var(--dimmer); font-size:13px; }
  .dhead .spacer { margin-left:auto; display:flex; gap:8px; flex:none; }
  .fm { display:flex; gap:6px 16px; flex-wrap:wrap; color:var(--dim);
        font-size:12px; padding:8px 0 14px; border-bottom:1px solid var(--line);
        margin-bottom:16px; }
  .fm b { color:var(--dimmer); font-weight:400; }
  /* Milestone gate line — SM-N's `Requires:`, the rule that says whether it may open. */
  .gate { margin:10px 0 2px; padding:8px 11px; border-left:2px solid var(--milestone);
          background:var(--panel); border-radius:0 5px 5px 0; font-size:13px; color:var(--dim); }
  .gate b { color:var(--milestone); font-weight:400; margin-right:7px; }
  .body { font-size:14.5px; }
  .body h1 { font-size:20px; margin:26px 0 8px; }
  .body h2 { font-size:17px; margin:26px 0 8px; padding-bottom:5px;
             border-bottom:1px solid var(--line); }
  .body h3 { font-size:15px; margin:20px 0 6px; color:var(--dim); }
  .body p, .body li { line-height:1.65; }
  .body code { font-family:var(--mono); font-size:12.5px; background:var(--panel2);
               padding:1px 5px; border-radius:4px; }
  .body pre { background:var(--panel); border:1px solid var(--line); border-radius:8px;
              padding:11px 13px; overflow-x:auto; }
  .body pre code { background:none; padding:0; font-size:12.5px; line-height:1.5; }
  .body blockquote { margin:12px 0; padding:2px 14px; border-left:3px solid var(--line);
                     color:var(--dim); }
  .body hr { border:0; border-top:1px solid var(--line); margin:22px 0; }
  .body table { border-collapse:collapse; width:100%; margin:12px 0; font-size:13px;
                display:block; overflow-x:auto; }
  .body th, .body td { border:1px solid var(--line); padding:5px 9px; text-align:left;
                       vertical-align:top; }
  .body th { background:var(--panel2); color:var(--dim); font-weight:600; }
  .tref { font-family:var(--mono); font-size:.92em; border-bottom:1px dotted currentColor; }
  .tref.gone { color:var(--dimmer); border:0; cursor:default; }
  .pathref { font-family:var(--mono); font-size:.92em; color:var(--dim); }
  .pathref:hover { color:var(--accent); }
  .refs { margin-top:28px; padding-top:14px; border-top:1px solid var(--line); }
  .refs h3 { color:var(--dimmer); font-size:11px; text-transform:uppercase;
             letter-spacing:.8px; margin:0 0 8px; }
  .refs .row { margin-bottom:6px; font-size:13px; }

  /* stats */
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr));
           gap:10px; margin-bottom:22px; }
  .tile { background:var(--panel); border:1px solid var(--line); border-radius:8px;
          padding:12px 14px; }
  .tile .k { color:var(--dimmer); font-size:11px; text-transform:uppercase;
             letter-spacing:.8px; }
  .tile .v { font-size:24px; font-variant-numeric:tabular-nums; margin:4px 0 1px;
             font-family:var(--mono); }
  .tile .s { color:var(--dimmer); font-size:11.5px; }
  h2.sec { font-size:13px; text-transform:uppercase; letter-spacing:.9px;
           color:var(--dim); margin:26px 0 10px; }
  table.data { border-collapse:collapse; width:100%; font-size:13px; }
  table.data th { text-align:left; color:var(--dimmer); font-weight:400; font-size:11px;
                  text-transform:uppercase; letter-spacing:.6px;
                  border-bottom:1px solid var(--line); padding:4px 8px; }
  table.data td { padding:4px 8px; border-bottom:1px solid var(--line);
                  font-variant-numeric:tabular-nums; }
  table.data td.num { text-align:right; font-family:var(--mono); font-size:12.5px; }
  table.data td.name { font-family:var(--mono); font-size:12.5px; }
  .stale { color:var(--perf); }
  .note { color:var(--dimmer); font-size:12px; margin:6px 0 0; }
  .bar { height:4px; background:var(--panel2); border-radius:2px; overflow:hidden;
         margin-top:6px; }
  .bar i { display:block; height:100%; }

  /* cargo + places */
  .warns { border:1px solid rgba(255,194,92,.4); background:rgba(255,194,92,.05);
           border-radius:8px; padding:8px 12px; margin-bottom:14px; }
  .warns h3 { color:var(--perf); font-size:11px; text-transform:uppercase;
              letter-spacing:.8px; margin:0 0 4px; font-weight:600; }
  .warns td { border:0 !important; padding:2px 8px 2px 0 !important; vertical-align:top; }
  h2.grp { display:flex; gap:10px; align-items:center; }
  h2.grp::after { content:""; flex:1; border-top:1px solid var(--line); }
  h3.subgrp { font-size:11px; text-transform:uppercase; letter-spacing:.8px;
              color:var(--dimmer); margin:12px 0 6px; font-weight:400; }
  ul.list li.crow { flex-wrap:wrap; row-gap:1px; }
  .creg { font-family:var(--mono); font-size:12.5px; width:26px; flex:none; color:var(--dimmer); }
  .cname { flex:1 1 220px; }
  .croute { flex:none; display:flex; gap:4px; flex-wrap:wrap; align-items:baseline; font-size:12px; }
  .badge { font-family:var(--mono); font-size:11.5px; border:1px solid var(--line);
           border-radius:4px; padding:0 6px; color:var(--fg); }
  a.badge:hover { border-color:var(--accent); text-decoration:none; }
  .badge.road { border-style:dashed; }
  .muted, .badge.any { color:var(--dimmer); }
  .cmeta { margin-left:auto; flex:none; display:flex; gap:12px; align-items:baseline;
           font-size:12px; color:var(--dim); }
  .cnote { flex-basis:100%; padding-left:38px; color:var(--dimmer); font-size:12.5px; }
  .pcard { background:var(--panel); border:1px solid var(--line); border-radius:8px;
           padding:9px 13px; margin-bottom:8px; }
  .pcard .ph { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
  .pcard .pt { font-family:var(--mono); font-size:13.5px; }
  .pcard .pm { color:var(--dim); font-size:12.5px; margin-top:2px; }
  .pcard .pm b, .pcard .pf b { color:var(--dimmer); font-weight:400; }
  .pcard .pf { font-size:12.5px; margin-top:3px; }
  /* sounds */
  .scard.drag { border-color:var(--accent); background:var(--panel2); }
  .scard .sbtns { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:6px; }
  .scard audio { height:28px; }
  .scard .take { display:flex; gap:6px; align-items:center; font-family:var(--mono);
                 font-size:11.5px; color:var(--dim); }
  .scard details { margin-top:4px; }
  .scard summary { cursor:pointer; color:var(--dimmer); font-size:12px; }
  .scard .body { font-size:13.5px; }
  .scard .body p:first-child { margin-top:6px; }
  .scard .thumb { float:left; width:56px; height:56px; object-fit:contain; margin:0 12px 4px 0;
                  background:var(--panel2); border-radius:6px; }
  .scard .drop { color:var(--dimmer); font-size:11.5px; margin-left:auto; }
  .guide { background:var(--panel); border:1px solid var(--line); border-radius:8px;
           padding:2px 14px; margin-bottom:14px; }
  .guide summary { cursor:pointer; padding:8px 0; color:var(--dim); }
</style>
</head>
<body>
<header>
  <div class="brand">AUTOS <span>· planning</span></div>
  <nav>
    <a href="#/tickets" data-nav="tickets">Tickets</a>
    <a href="#/cargo" data-nav="cargo">Cargo</a>
    <a href="#/places" data-nav="places">Places</a>
    <a href="#/items" data-nav="items">Items</a>
    <a href="#/sounds" data-nav="sounds">Sounds</a>
    <a href="#/stats" data-nav="stats">Overview</a>
  </nav>
  <input id="search" type="search" placeholder="filter by id, title, text…" autocomplete="off">
  <button class="act" id="reindex" title="Rescan .planning and re-measure the repo">Reindex</button>
</header>
<main id="app">loading…</main>

<script type="module">
/* ─────────────────────────── data ─────────────────────────── */
let TICKETS = [], LANES = [], BY_ID = new Map(), BACKLINKS = new Map(), STATS = null, STORY = null, SOUNDS = null, ITEMS = null;

async function load() {
  const [t, s, c, so, it] = await Promise.all([
    fetch('tickets.json?' + Date.now()).then(r => r.json()),
    fetch('stats.json?' + Date.now()).then(r => r.json()),
    fetch('cargo.json?' + Date.now()).then(r => r.json()),
    fetch('sounds.json?' + Date.now()).then(r => r.json()),
    fetch('items.json?' + Date.now()).then(r => r.json()),
  ]);
  TICKETS = t.tickets; LANES = t.laneOrder || []; STATS = s; STORY = c; SOUNDS = so; ITEMS = it;
  BY_ID = new Map(TICKETS.map(x => [x.id, x]));
  BACKLINKS = new Map();
  for (const tk of TICKETS) {
    for (const r of tk.refs) {
      if (!BACKLINKS.has(r)) BACKLINKS.set(r, []);
      BACKLINKS.get(r).push(tk.id);
    }
  }
}

/* ───────────────────────── markdown ────────────────────────
 * Small block/inline renderer — enough for the ticket corpus (headings, lists,
 * fenced code, tables, blockquotes, rules) and nothing more. Inline runs in two
 * passes: code spans / links / ticket refs / file paths are pulled out into
 * placeholder tokens first, so emphasis can never chew through generated HTML. */
const esc = s => s.replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c]));

const TICKET_RE = /\b(?:FEAT|BUG|PERF|QUAL|INFRA|ASSET|SM)-\d+\b/;
const PATH_RE = /(?:\.planning|src|test|data|assets|tools|scenarios|docs)\/[\w./@-]*[\w]\.\w{1,5}/;
// Emphasis and links must survive a line break: the tickets are hard-wrapped at
// ~100 columns, so most bold runs of any length straddle a newline.
const LINK_RE = /\[([^\]]+)\]\(([^)\s]+)\)/;
const CODE_RE = /`[^`\n]+`/;

function ticketLink(id) {
  const t = BY_ID.get(id);
  if (!t) return `<span class="tref gone">${id}</span>`;
  const title = esc(`${t.title} — ${t.status}`);
  return `<a class="tref" href="#/t/${id}" title="${title}">${id}</a>`;
}
const pathLink = p =>
  `<a class="pathref" href="vscode://file${STATS.root}/${p}" title="open ${p} in VS Code">${p}</a>`;

function inline(text) {
  const tokens = [];
  const keep = html => { tokens.push(html); return `\u0000${tokens.length - 1}\u0000`; };

  const combined = new RegExp(
    [CODE_RE.source, LINK_RE.source, TICKET_RE.source, PATH_RE.source].join('|'), 'g',
  );
  let out = text.replace(combined, (m) => {
    if (m.startsWith('`')) {
      // Tickets write paths and ids inside backticks far more often than bare,
      // so a code span that IS one stays a code span but becomes clickable.
      const inner = m.slice(1, -1);
      const code = `<code>${inner}</code>`;
      if (new RegExp(`^${TICKET_RE.source}$`).test(inner)) {
        return keep(BY_ID.has(inner)
          ? `<a class="tref" href="#/t/${inner}">${code}</a>` : code);
      }
      if (new RegExp(`^${PATH_RE.source}$`).test(inner)) {
        return keep(`<a class="pathref" href="vscode://file${STATS.root}/${inner}"`
          + ` title="open ${inner} in VS Code">${code}</a>`);
      }
      return keep(code);
    }
    const link = LINK_RE.exec(m);
    if (link && link[0] === m) {
      const [, label, href] = link;
      const local = !/^[a-z]+:/i.test(href) && !href.startsWith('#');
      const url = local ? `vscode://file${STATS.root}/${href.replace(/^\.\//, '')}` : href;
      const ext = /^https?:/i.test(url) ? ' target="_blank" rel="noopener"' : '';
      return keep(`<a href="${url}"${ext}>${label}</a>`);
    }
    if (new RegExp(`^${TICKET_RE.source}$`).test(m)) return keep(ticketLink(m));
    return keep(pathLink(m));
  });

  out = out
    // Italic BEFORE bold, so `**bold with *italic* inside**` still closes: the
    // italic pass can't start on a `**` (a lone `*` must be followed by a
    // non-`*`), so it only ever consumes the inner pair.
    .replace(/(^|[\s(])\*([^*]+?)\*(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>')
    .replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])_([^_]+?)_(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>');

  return out.replace(/\u0000(\d+)\u0000/g, (_, i) => tokens[+i]);
}

function md(src, escaped = false) {
  // `esc` runs once, at the top: every block test below therefore matches on the
  // ESCAPED text (`&gt;`, not `>`). The recursive blockquote call passes
  // escaped=true so its already-escaped buffer is not escaped a second time.
  const lines = (escaped ? src : esc(src)).split('\n');
  const out = [];
  let i = 0;
  const isTableSep = s => /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(s) && s.includes('-');
  const cells = s => s.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim());

  while (i < lines.length) {
    const line = lines[i];

    if (/^```/.test(line)) {
      const buf = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push(`<pre><code>${buf.join('\n')}</code></pre>`);
      continue;
    }
    if (!line.trim()) { i++; continue; }
    if (/^(---+|\*\*\*+)\s*$/.test(line)) { out.push('<hr>'); i++; continue; }

    const h = /^(#{1,6})\s+(.*)$/.exec(line);
    if (h) { out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }

    if (line.includes('|') && isTableSep(lines[i + 1] || '')) {
      const head = cells(line);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes('|') && lines[i].trim()) rows.push(cells(lines[i++]));
      out.push(
        `<table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join('')}</tr></thead>`
        + `<tbody>${rows.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`,
      );
      continue;
    }

    if (/^\s*&gt;/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*&gt;/.test(lines[i])) {
        buf.push(lines[i++].replace(/^\s*&gt;\s?/, ''));
      }
      out.push(`<blockquote>${md(buf.join('\n'), true)}</blockquote>`);
      continue;
    }

    const li = /^\s*([-*+]|\d+\.)\s+/.exec(line);
    if (li) {
      const ordered = /\d/.test(li[1]);
      const items = [];
      while (i < lines.length) {
        const m = /^\s*(?:[-*+]|\d+\.)\s+(.*)$/.exec(lines[i]);
        if (m) { items.push(m[1]); i++; }
        else if (/^\s+\S/.test(lines[i]) && items.length) { items[items.length - 1] += ` ${lines[i].trim()}`; i++; }
        else break;
      }
      const tag = ordered ? 'ol' : 'ul';
      out.push(`<${tag}>${items.map(x => `<li>${inline(x)}</li>`).join('')}</${tag}>`);
      continue;
    }

    const para = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|```|\s*&gt;|\s*([-*+]|\d+\.)\s|---+\s*$)/.test(lines[i])) {
      if (lines[i].includes('|') && isTableSep(lines[i + 1] || '')) break;
      para.push(lines[i++]);
    }
    if (para.length) out.push(`<p>${inline(para.join('\n'))}</p>`);
    else i++;
  }
  return out.join('\n');
}

/* ───────────────────────── filters ─────────────────────────
 * Filter state lives in the hash so a filtered list is a shareable/bookmarkable
 * URL and Back works between list and detail. Each filterable view has its own
 * axes; a chip toggles an axis of whichever view is on screen. */
const TYPES = ['milestone', 'feature', 'bug', 'perf', 'quality', 'infra', 'asset'];
const STATUSES = ['open', 'idea', 'closed', 'cancelled'];
const STATUS_COLOR = { open: '#6fb3ff', idea: '#d9b36f', closed: '#7fd97f', cancelled: '#8b94a3' };
const DEFAULTS = {
  tickets: { type: [], status: ['open'], sev: [], lane: [] },
  cargo: { kind: [], region: [], place: [], asset: [] },
  sounds: { status: [], group: [] },
  items: { build: [], needs: [], where: [], design: [], status: [] },
};
const filterView = () => (location.hash.startsWith('#/cargo') ? 'cargo'
  : location.hash.startsWith('#/sounds') ? 'sounds'
  : location.hash.startsWith('#/items') ? 'items' : 'tickets');

function readFilters(view = 'tickets') {
  const q = new URLSearchParams((location.hash.split('?')[1] || ''));
  const d = DEFAULTS[view];
  return Object.fromEntries(Object.keys(d).map(k => [k, q.has(k) ? q.get(k).split(',').filter(Boolean) : d[k]]));
}
function writeFilters(f, view = 'tickets') {
  const q = new URLSearchParams();
  for (const k of Object.keys(DEFAULTS[view])) {
    if (String(f[k]) !== String(DEFAULTS[view][k])) q.set(k, f[k].join(','));
  }
  const s = q.toString();
  location.hash = `#/${view}` + (s ? `?${s}` : '');
}
function toggle(kind, value, view = filterView()) {
  const f = readFilters(view);
  f[kind] = f[kind].includes(value) ? f[kind].filter(v => v !== value) : [...f[kind], value];
  writeFilters(f, view);
}

function matches(t, f, q) {
  if (f.type.length && !f.type.includes(t.type)) return false;
  if (f.status.length && !f.status.includes(t.status)) return false;
  if (f.sev.length && !f.sev.includes(t.severity)) return false;   // t.severity null ⇒ excluded
  if (f.lane.length && !f.lane.includes(t.lane)) return false;     // lanes come from MILESTONES.md tables
  if (q) {
    const hay = `${t.id} ${t.title} ${t.blurb} ${t.body}`.toLowerCase();
    if (!q.split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}

/* ─────────────────────────── views ─────────────────────────── */
const fmtBytes = (b) => (b >= 1e6 ? `${(b / 1048576).toFixed(1)} MB`
  : b >= 1e3 ? `${(b / 1024).toFixed(0)} KB` : `${b} B`);
const fmtNum = (n) => n.toLocaleString();
const daysAgo = (iso) => Math.round((Date.now() - new Date(iso)) / 86400000);

function chip(kind, value, on, count, color) {
  const style = on && color ? ` style="background:${color}"` : color ? ` style="color:${color}"` : '';
  return `<button class="chip${on ? ' on' : ''}" data-kind="${kind}" data-val="${value}"${style}>`
    + `<i class="dot"></i>${value}<span class="n">${count}</span></button>`;
}

function viewTickets() {
  const f = readFilters();
  const q = document.getElementById('search').value.trim().toLowerCase();
  const shown = TICKETS.filter(t => matches(t, f, q));
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(`--${n}`).trim();

  // Each axis counts against the *other* axes only, so a chip's number is what
  // you'd get by turning it on — not what's on screen right now.
  const nType = (v) => TICKETS.filter(t => t.type === v && matches(t, { ...f, type: [] }, q)).length;
  const nStat = (v) => TICKETS.filter(t => t.status === v && matches(t, { ...f, status: [] }, q)).length;
  const nSev = (v) => TICKETS.filter(t => t.severity === v && matches(t, { ...f, sev: [] }, q)).length;
  const nLane = (v) => TICKETS.filter(t => t.lane === v && matches(t, { ...f, lane: [] }, q)).length;

  const rows = shown.map(t => `
    <li>
      <a class="tid" href="#/t/${t.id}" style="color:${css(t.type)}">${t.id}</a>
      <span class="ttitle">${esc(t.title)}</span>
      <span class="tblurb">${esc(t.blurb)}</span>
      <span class="tmeta">
        ${t.phase
          ? `<span class="sev" style="color:${css('milestone')}">${t.phase}</span>`
          : `<span class="sev" style="color:${css(t.severity)}">${t.severity}</span>`}
        <span class="st ${t.status}">${t.status}</span>
      </span>
    </li>`).join('');

  return `
    <div class="filters">
      <div class="frow"><span class="flabel">Type</span>
        ${TYPES.map(v => chip('type', v, f.type.includes(v), nType(v), css(v))).join('')}</div>
      <div class="frow"><span class="flabel">Status</span>
        ${STATUSES.map(v => chip('status', v, f.status.includes(v), nStat(v), STATUS_COLOR[v])).join('')}</div>
      <div class="frow"><span class="flabel">Severity</span>
        ${STATS.severityOrder.map(v => chip('sev', v, f.sev.includes(v), nSev(v), css(v))).join('')}</div>
      <div class="frow"><span class="flabel">Lane</span>
        ${LANES.map(v => chip('lane', v, f.lane.includes(v), nLane(v),
          v === 'unplaced' ? css('bug') : v.startsWith('SM-') ? css('milestone') : '')).join('')}</div>
    </div>
    <div class="count">${shown.length} of ${TICKETS.length} tickets${q ? ` matching “${esc(q)}”` : ''}</div>
    <ul class="list">${rows || '<li><span class="tblurb">nothing matches</span></li>'}</ul>`;
}

function viewTicket(id) {
  const t = BY_ID.get(id);
  if (!t) return `<p>No ticket <code>${esc(id)}</code>. <a href="#/tickets">Back to the list</a></p>`;
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(`--${n}`).trim();
  const back = (BACKLINKS.get(id) || []).sort();
  const fmRow = (k, v) => (v ? `<span><b>${k}</b> ${v}</span>` : '');

  return `
    <div class="crumb"><a href="#/tickets">← tickets</a> · ${t.file}</div>
    <div class="dhead">
      <div>
        <div class="id" style="color:${css(t.type)}">${t.id}</div>
        <h1>${esc(t.title)}</h1>
      </div>
      <div class="spacer">
        <a class="act" style="display:inline-block"
           href="vscode://file${STATS.root}/${t.file}:${t.line || 1}">Open in editor</a>
      </div>
    </div>
    <div class="fm">
      ${fmRow('type', t.type + (t.typeRaw !== t.type ? ` <i style="color:var(--perf)">(${t.typeRaw})</i>` : ''))}
      ${fmRow('status', t.status + (t.statusRaw !== t.status ? ` <i style="color:var(--perf)">(${t.statusRaw})</i>` : ''))}
      ${fmRow('lane', t.lane && esc(t.lane))}
      ${t.severity ? fmRow('severity', `<span style="color:${css(t.severity)}">${t.severity}</span>`) : ''}
      ${fmRow('opened', t.opened)} ${fmRow('updated', t.updated)}
      ${fmRow(t.phase === 'shipped' ? 'shipped' : 'closed', t.closed)}
    </div>
    ${t.requires ? `<div class="gate"><b>Requires</b> ${inline(esc(t.requires))}</div>` : ''}
    <div class="body">${md(
      t.body
        .replace(/^#\s+.*(\n|$)/m, '')
        // Milestones hoist `**Requires:** …` into the gate box above; drop the
        // original so the detail page doesn't state the same gate twice.
        .replace(t.requires ? /^\*\*Requires:?\*\*[\s\S]*?(?=\n\s*\n)/m : /(?!)/, ''),
    )}</div>
    <div class="refs">
      <h3>Links</h3>
      <div class="row"><b style="color:var(--dimmer)">references</b>
        ${t.refs.length ? t.refs.map(ticketLink).join(' ') : '<span style="color:var(--dimmer)">none</span>'}</div>
      <div class="row"><b style="color:var(--dimmer)">referenced by</b>
        ${back.length ? back.map(ticketLink).join(' ') : '<span style="color:var(--dimmer)">none</span>'}</div>
      ${t.plan ? `<div class="row"><b style="color:var(--dimmer)">plan</b> ${inline(esc(t.plan))}</div>` : ''}
      ${t.handoff ? `<div class="row"><b style="color:var(--dimmer)">handoff</b> ${inline(esc(t.handoff))}</div>` : ''}
    </div>`;
}

/* ─────────────────────── cargo + places ───────────────────────
 * Story-mode burn-down: cargo.md's rows grouped by delivery type, and every
 * place a job can start or end with the cargo routed through it. Both come
 * from cargo.json; its warnings show above whichever view they concern. */
const KINDS = ['courier', 'haul', 'freight', 'fragile'];
const KIND_COLOR = { courier: '#6fb3ff', haul: '#ffc25c', freight: '#5fd0c0', fragile: '#ff9ad5' };
const ASSET_STATES = ['shipped', 'ticketed', 'none', 'missing'];
const ASSET_COLOR = { shipped: '#7fd97f', ticketed: '#6fb3ff', none: '#8b94a3', missing: '#ff7a7a' };
const PLACE_STATUS_COLOR = { live: '#7fd97f', planned: '#6fb3ff', proposed: '#ffc25c' };
const placeHref = (name) => `#/cargo?place=${encodeURIComponent(name)}`;
const places = (c) => [...c.from, ...c.to].map(e => e.name);

function warnStrip(view) {
  return warnTable(STORY.warnings.filter(x => x.view === view || x.view === 'both'));
}
function warnTable(w) {
  if (!w.length) return '';
  const rows = w.map(x => `<tr>
      <td class="name"><a class="pathref" href="vscode://file${STATS.root}/${x.file}:${x.line || 1}">${x.file.replace('.planning/story-mode/', '')}${x.line ? `:${x.line}` : ''}</a></td>
      <td>${esc(x.msg)}</td></tr>`).join('');
  return `<div class="warns"><h3>${w.length} warning${w.length === 1 ? '' : 's'}</h3>
    <table class="data"><tbody>${rows}</tbody></table></div>`;
}

function cargoMatches(c, f, q) {
  if (f.kind.length && !f.kind.includes(c.kind)) return false;
  if (f.region.length && !f.region.includes(c.region)) return false;
  // `generic` matches only the blank-route rows; `any` is never a named place.
  if (f.place.length && !f.place.some(p => (p === 'generic' ? c.generic : places(c).includes(p)))) return false;
  if (f.asset.length && !f.asset.some(a => c.assetStatus.includes(a))) return false;
  if (q) {
    const hay = `${c.name} ${c.route} ${c.note} ${c.assetText}`.toLowerCase();
    if (!q.split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}

function badge(e) {
  if (e.name === 'any') return `<span class="badge any">${esc(e.label)}</span>`;
  return `<a class="badge${e.roadside ? ' road' : ''}" href="${placeHref(e.name)}" title="only cargo to or from ${esc(e.name)}">${esc(e.label)}</a>`;
}

function cargoRow(c) {
  const route = c.generic ? '<span class="muted">generic</span>'
    : `${c.from.map(badge).join('')}<span class="muted">→</span>${c.to.map(badge).join('')}`;
  const assets = c.assets.length
    ? c.assets.map(a => `<span title="${esc(c.assetText)}">${ticketLink(a.id)} <span style="color:${ASSET_COLOR[a.status]}">${
      a.status === 'shipped' ? '● shipped' : a.status === 'ticketed' ? '○ ticketed' : '✕ no ticket'}</span></span>`).join(' ')
    : `<span class="muted" title="${esc(c.assetText)}">no model</span>`;
  return `<li class="crow">
      <span class="creg">${c.region}</span>
      <span class="cname">${esc(c.name)}</span>
      <span class="croute">${route}</span>
      <span class="cmeta">${c.mass ? `<span>${esc(c.mass)}</span>` : ''}<span>${assets}</span></span>
      ${c.note ? `<div class="cnote">${inline(esc(c.note))}</div>` : ''}
    </li>`;
}

function viewCargo() {
  const all = STORY.cargo;
  const f = readFilters('cargo');
  const q = document.getElementById('search').value.trim().toLowerCase();
  const shown = all.filter(c => cargoMatches(c, f, q));
  const n = (axis, test) => all.filter(c => test(c) && cargoMatches(c, { ...f, [axis]: [] }, q)).length;

  const regions = [...new Set(all.map(c => c.region))].sort();
  const placeNames = ['generic', ...[...new Set(all.flatMap(places))].filter(p => p !== 'any').sort()];
  const assetStates = ASSET_STATES.filter(a => a !== 'missing' || all.some(c => c.assetStatus.includes(a)));

  const groups = KINDS.map(kind => {
    const rows = shown.filter(c => c.kind === kind);
    if (!rows.length) return '';
    // Within a type: sub-groups in doc order (People under Courier), each by region.
    const sub = [...new Set(rows.map(c => c.group))].map(g => {
      const list = rows.filter(c => c.group === g)
        .sort((a, b) => a.region.localeCompare(b.region, undefined, { numeric: true }) || a.idx - b.idx);
      return `${g ? `<h3 class="subgrp">${g}</h3>` : ''}<ul class="list">${list.map(cargoRow).join('')}</ul>`;
    }).join('');
    return `<h2 class="sec grp" style="color:${KIND_COLOR[kind]}">${kind} <span class="muted">${rows.length}</span></h2>${sub}`;
  }).join('');

  return `
    ${warnStrip('cargo')}
    <div class="filters">
      <div class="frow"><span class="flabel">Type</span>
        ${KINDS.map(v => chip('kind', v, f.kind.includes(v), n('kind', c => c.kind === v), KIND_COLOR[v])).join('')}</div>
      <div class="frow"><span class="flabel">Region</span>
        ${regions.map(v => chip('region', v, f.region.includes(v), n('region', c => c.region === v))).join('')}</div>
      <div class="frow"><span class="flabel">Place</span>
        ${placeNames.map(v => chip('place', v, f.place.includes(v),
          n('place', c => (v === 'generic' ? c.generic : places(c).includes(v))))).join('')}</div>
      <div class="frow"><span class="flabel">Asset</span>
        ${assetStates.map(v => chip('asset', v, f.asset.includes(v), n('asset', c => c.assetStatus.includes(v)), ASSET_COLOR[v])).join('')}</div>
    </div>
    <div class="count">${shown.length} of ${all.length} cargo rows${q ? ` matching “${esc(q)}”` : ''}
      · from <a class="pathref" href="vscode://file${STATS.root}/.planning/story-mode/cargo.md">.planning/story-mode/cargo.md</a></div>
    ${groups || '<ul class="list"><li><span class="tblurb">nothing matches</span></li></ul>'}`;
}

/** "sends 3: a · b · c" — each item links to the cargo list filtered on this place. */
function flowLine(label, idxs, place) {
  const items = idxs.map(i => STORY.cargo[i])
    .map(c => `<a href="${placeHref(place)}" style="color:${KIND_COLOR[c.kind]}" title="${c.kind} · ${c.region}">${esc(c.name)}</a>`);
  return `<div class="pf"><b>${label}</b> ${idxs.length}${items.length ? ': ' + items.join(' <span class="muted">·</span> ') : ''}</div>`;
}

function viewPlaces() {
  const { live, planned, spots, summary } = STORY.places;
  const tile = (k, v, sub) => `<div class="tile"><div class="k">${k}</div>
    <div class="v">${v}</div><div class="s">${sub || ''}</div></div>`;
  const status = (st) => `<span class="st" style="color:${PLACE_STATUS_COLOR[st] || 'var(--dim)'}">${esc(st)}</span>`;
  const meta = (pairs) => `<div class="pm">${pairs.filter(([, v]) => v).map(([k, v]) => `<b>${k}</b> ${v}`).join(' · ')}</div>`;
  const hours = (h) => (Array.isArray(h) ? `${h[0]}–${h[1]} h` : `${h} h`);

  const liveCards = live.map(p => `<div class="pcard">
      <div class="ph"><span class="pt">${p.type}</span><span class="muted">× ${p.count}</span>${status('live')}</div>
      ${meta([
        ['model', p.model ? `<code>${esc(p.model)}</code>` : p.modelPool ? `pool <code>${esc(p.modelPool)}</code>` : '<span class="muted">none</span>'],
        ['siting', p.siting], ['tags', p.tags.join(', ')], ['drop zone', p.drop ? 'yes' : ''],
      ])}
      ${meta([['gives', p.gives
        ? `${p.gives.families.join(', ')} · ${p.gives.slots} slot${p.gives.slots === 1 ? '' : 's'} each (${p.gives.slots * p.count} total)`
          + ` · expiry ${hours(p.gives.expiryH)}${p.gives.minEmptyH ? ` · min empty ${p.gives.minEmptyH} h` : ''}`
        : '<span class="muted">gives nothing</span>']])}
      ${flowLine('sends', p.sends, p.type)}${flowLine('receives', p.receives, p.type)}
    </div>`).join('');

  const plannedCards = planned.map(p => `<div class="pcard">
      <div class="ph"><span class="pt">${esc(p.type)}</span>${status(p.status)}
        <span class="muted">${esc(p.statusRaw.replace(/^\w+\s*/, ''))}</span></div>
      ${meta([['region', esc(p.region)], ['gives', inline(esc(p.docGives))], ['receives', inline(esc(p.docReceives))],
        ['tags', esc(p.tags)], ['model', inline(esc(p.model))], ['ticket', inline(esc(p.ticket))]])}
      ${flowLine('sends', p.sends, p.type)}${flowLine('receives', p.receives, p.type)}
    </div>`).join('');

  const spotCards = spots.map(p => `<div class="pcard">
      <div class="ph"><span class="pt">${esc(p.spot)}</span>${status((/^\w+/.exec(p.status) || [''])[0])}</div>
      ${meta([['form', inline(esc(p.form))], ['tags', esc(p.tags)], ['promises an object', inline(esc(p.promises))],
        ['status', esc(p.status)], ['note', inline(esc(p.note))]])}
      ${flowLine('sends', p.sends, p.names[0])}${flowLine('receives', p.receives, p.names[0])}
    </div>`).join('');

  return `
    ${warnStrip('places')}
    <div class="tiles">
      ${tile('Live POIs', summary.livePois, `${live.length} types · POI_ROSTER`)}
      ${tile('Live offer slots', summary.liveSlots, 'count × slots, givers only')}
      ${tile('Planned types', summary.plannedTypes, 'pois.md')}
    </div>
    <h2 class="sec">Live types — from <code>src/poi.js</code> + <code>data/offers.js</code></h2>${liveCards}
    <h2 class="sec">Planned types — from pois.md</h2>${plannedCards}
    <h2 class="sec">Roadside spots — from pois.md</h2>${spotCards}
    <p class="note">Sends / receives are cargo.md routes that name the place exactly; <code>any</code> and generic rows count for no place.</p>`;
}

function viewStats() {
  const s = STATS;
  const tile = (k, v, sub) => `<div class="tile"><div class="k">${k}</div>
    <div class="v">${v}</div><div class="s">${sub || ''}</div></div>`;
  const age = (iso) => {
    const d = daysAgo(iso);
    if (d >= 7) return `<span class="stale">${d} days old</span>`;
    return d <= 0 ? 'today' : `${d} day${d === 1 ? '' : 's'} old`;
  };

  const cold = s.perf?.cold;
  const fr = s.perf?.frames;
  const distPct = s.dist ? (100 * s.dist.gz / s.dist.raw).toFixed(0) : 0;

  const codeRows = s.code.map(r => `<tr>
      <td class="name">${r.name}/</td><td class="num">${r.files}</td>
      <td class="num">${fmtNum(r.lines)}</td><td class="num">${fmtBytes(r.bytes)}</td>
      <td><div class="bar"><i style="width:${(100 * r.lines / s.codeTotal.lines).toFixed(1)}%;
        background:var(--accent)"></i></div></td></tr>`).join('');

  const distRows = (s.dist?.byExt || []).map(e => `<tr>
      <td class="name">${e.ext}</td><td class="num">${e.files}</td>
      <td class="num">${fmtBytes(e.raw)}</td><td class="num">${fmtBytes(e.gz)}</td></tr>`).join('');

  const typeRows = Object.entries(s.tickets.byType)
    .sort((a, b) => b[1].total - a[1].total)
    .map(([k, v]) => `<tr><td class="name" style="color:var(--${k})">${k}</td>
      <td class="num">${v.open}</td><td class="num">${v.total}</td></tr>`).join('');

  const driftRows = s.drift.map(d => `<tr>
      <td class="name">${d.file.replace('.planning/todos/', '')}</td>
      <td class="name">${d.field}</td>
      <td class="name" style="color:var(--perf)">${esc(String(d.value))}</td>
      <td class="name" style="color:var(--dimmer)">${d.canon || d.note || '—'}</td></tr>`).join('');

  return `
    <div class="tiles">
      ${tile('Source', fmtNum(s.codeTotal.lines), `lines · ${s.codeTotal.files} files · ${fmtBytes(s.codeTotal.bytes)}`)}
      ${tile('Planning', fmtNum(s.planning.lines), `lines of markdown · ${s.planning.files} files`)}
      ${tile('Tickets', `${s.tickets.open}/${s.tickets.total}`, `open · ${s.tickets.closed} closed · ${s.tickets.cancelled} cancelled`)}
      ${s.dist ? tile('Build', fmtBytes(s.dist.raw), `dist/ raw · built ${age(s.dist.built)}`) : ''}
      ${s.dist ? tile('On the wire', fmtBytes(s.dist.gz), `gzipped · ${distPct}% of raw`) : ''}
      ${cold ? tile('Cold → ready', `${cold.msToReady} ms`, `${cold.msToRingComplete} ms to full chunk ring · ${age(cold.date)}`) : ''}
      ${fr ? tile('Frame time', `${fr.p50} ms`, `p50 · p95 ${fr.p95} · ${fr.fpsMean} fps mean · ${age(fr.date)}`) : ''}
    </div>

    ${cold ? `<p class="note">Load and frame numbers are read from the newest
      <code>perf-runs/</code> artifact (${cold.run}, preset ${cold.preset}, seed ${cold.seed}) —
      they are <b>not</b> measured live, since that means booting headless Chrome. Re-run the
      PERF-08 harness to refresh them.</p>` : ''}

    <h2 class="sec">Code by area</h2>
    <table class="data">
      <thead><tr><th>area</th><th style="text-align:right">files</th>
        <th style="text-align:right">lines</th><th style="text-align:right">bytes</th><th></th></tr></thead>
      <tbody>${codeRows}
        <tr><td class="name"><b>total</b></td><td class="num">${s.codeTotal.files}</td>
        <td class="num">${fmtNum(s.codeTotal.lines)}</td>
        <td class="num">${fmtBytes(s.codeTotal.bytes)}</td><td></td></tr></tbody>
    </table>

    ${s.dist ? `<h2 class="sec">Shipped weight — dist/ by file type</h2>
    <table class="data">
      <thead><tr><th>ext</th><th style="text-align:right">files</th>
        <th style="text-align:right">raw</th><th style="text-align:right">gzip</th></tr></thead>
      <tbody>${distRows}
        <tr><td class="name"><b>total</b></td><td class="num">${s.dist.files}</td>
        <td class="num">${fmtBytes(s.dist.raw)}</td><td class="num">${fmtBytes(s.dist.gz)}</td></tr></tbody>
    </table>
    <p class="note"><code>.gz</code> files are counted as-is rather than double-compressed.</p>` : ''}

    <h2 class="sec">Tickets by type</h2>
    <table class="data">
      <thead><tr><th>type</th><th style="text-align:right">open</th>
        <th style="text-align:right">total</th></tr></thead>
      <tbody>${typeRows}</tbody>
    </table>

    <h2 class="sec">Frontmatter drift — ${s.drift.length} non-canonical values</h2>
    ${s.drift.length ? `<table class="data">
      <thead><tr><th>ticket</th><th>field</th><th>written</th><th>read as</th></tr></thead>
      <tbody>${driftRows}</tbody></table>
      <p class="note">The dashboard normalises these for filtering; the files are untouched.</p>`
    : '<p class="note">None — the tracker vocabulary is clean.</p>'}

    <p class="note" style="margin-top:24px">Indexed ${new Date(s.generated).toLocaleString()}.</p>`;
}

/* ─────────────────────────── sounds ───────────────────────────
 * FEAT-120's body, read live by index.mjs into sounds.json: one card per sound,
 * grouped by source. ▶ imports the GAME's own src/*-audio.js module and calls
 * the hook the ticket names, so what plays is the shipped code, never a copy.
 * Takes (wip/audio, assets/audio) play in <audio>; dropping a file on a card
 * uploads it into wip/audio/<slug>/. */
const SOUND_SOURCES = ['Synthesize', 'Record', 'Library', 'Engine bake'];
const SOUND_STATUSES = ['todo', 'wip', 'shipped', 'cut'];
const SOUND_COLOR = { todo: '#8b94a3', wip: '#ffc25c', shipped: '#7fd97f', cut: '#4d545f' };

/** Preview drivers for sustained voices that need parameters swept to be heard. */
function ramp(ms, step, end) {
  const t0 = performance.now();
  const id = setInterval(() => {
    const u = Math.min(1, (performance.now() - t0) / ms);
    step(u);
    if (u >= 1) { clearInterval(id); end(); }
  }, 30);
}
const DRIVERS = {
  async 'engine-sweep'() {
    const m = await import('/src/engine-audio.js');
    m.ensureEngineAudio();
    ramp(4000, u => m.updateEngineAudio(800 + 4200 * u, 1), () => m.updateEngineAudio(5000, 0, false));
  },
  async 'wind-sweep'() {
    const m = await import('/src/wind-audio.js');
    m.ensureWindAudio();
    const at = v => m.updateWindAudio({ velocity: { x: v, y: 0, z: 0 } });
    ramp(5000, u => at(45 * Math.sin(Math.PI * u)), () => at(0));
  },
  async crank() {
    const m = await import('/src/engine-audio.js');
    m.startCrankAudio();
    setTimeout(() => { m.stopCrankAudio(); m.playCatchAudio(); }, 1400);
  },
};
/** `module.js export` → one-shot (after the module's ensure*Audio, if any); a bare name → a driver. */
async function playHook(spec) {
  const [mod, fn] = spec.split(/\s+/);
  if (!fn) return DRIVERS[mod]();
  const m = await import('/src/' + mod);
  for (const [k, f] of Object.entries(m)) if (/^ensure\w*Audio$/.test(k)) f();
  m[fn]();
}

function soundMatches(x, f, q) {
  if (f.status.length && !f.status.includes(x.status)) return false;
  if (f.group.length && !f.group.includes(x.group)) return false;
  if (q) {
    const hay = `${x.title} ${x.source} ${x.group} ${x.notes}`.toLowerCase();
    if (!q.split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}

function soundCard(x) {
  const playable = x.play || x.takes.length;
  const play = x.play ? `<button class="act" data-play="${esc(x.play)}" title="${esc(x.play)}">▶ play</button>` : '';
  const takes = x.takes.map(p => `<span class="take"><audio controls preload="none" src="/${p}"></audio>${esc(p.split('/').pop())}</span>`).join('');
  return `<div class="pcard scard" data-slug="${x.slug}">
      <div class="ph">
        <span class="pt">${esc(x.title)}</span>
        <span class="st" style="color:${SOUND_COLOR[x.status]}">${x.status}</span>
        ${x.group ? `<span class="muted">${esc(x.group)}</span>` : ''}
        <span class="drop">drop takes → wip/audio/${x.slug}/</span>
      </div>
      ${playable ? `<div class="sbtns">${play}${takes}</div>` : ''}
      ${x.notes ? `<details${playable ? '' : ' open'}><summary>how</summary><div class="body">${md(x.notes)}</div></details>` : ''}
    </div>`;
}

function viewSounds() {
  const all = SOUNDS.sounds;
  const f = readFilters('sounds');
  const q = document.getElementById('search').value.trim().toLowerCase();
  const shown = all.filter(x => soundMatches(x, f, q));
  const n = (axis, test) => all.filter(x => test(x) && soundMatches(x, { ...f, [axis]: [] }, q)).length;
  const groups = [...new Set(all.map(x => x.group).filter(Boolean))];

  const sections = SOUND_SOURCES.map(src => {
    const mine = all.filter(x => x.source === src && x.status !== 'cut');
    const rows = shown.filter(x => x.source === src);
    if (!rows.length) return '';
    const done = mine.filter(x => x.status === 'shipped').length;
    return `<h2 class="sec grp">${src} <span class="muted">${done} / ${mine.length} shipped</span></h2>${rows.map(soundCard).join('')}`;
  }).join('');

  return `
    ${warnTable(SOUNDS.warnings)}
    ${SOUNDS.guide ? `<details class="guide"><summary>How to source</summary><div class="body">${md(SOUNDS.guide)}</div></details>` : ''}
    <div class="filters">
      <div class="frow"><span class="flabel">Status</span>
        ${SOUND_STATUSES.map(v => chip('status', v, f.status.includes(v), n('status', x => x.status === v), SOUND_COLOR[v])).join('')}</div>
      <div class="frow"><span class="flabel">Group</span>
        ${groups.map(v => chip('group', v, f.group.includes(v), n('group', x => x.group === v))).join('')}</div>
    </div>
    <div class="count">${shown.length} of ${all.length} sounds${q ? ` matching “${esc(q)}”` : ''}
      · from <a class="pathref" href="vscode://file${STATS.root}/${SOUNDS.file}">${SOUNDS.file}</a></div>
    ${sections || '<ul class="list"><li><span class="tblurb">nothing matches</span></li></ul>'}`;
}

async function uploadTakes(slug, files) {
  for (const file of files) {
    const r = await fetch(`/upload?slug=${encodeURIComponent(slug)}&name=${encodeURIComponent(file.name)}`, { method: 'POST', body: file });
    const j = await r.json();
    if (!j.ok) alert(j.msg);
  }
  await load(); render();
}

/* ─────────────────────────── items ───────────────────────────
 * FEAT-121's body, read live by index.mjs into items.json: one card per item,
 * grouped by category. The Build / Needs / Where chip counts are the at-a-glance
 * burn-down; filtering Where by a storefront is that shop's stock list. */
const ITEM_STATUSES = ['todo', 'wip', 'shipped', 'cut'];
const ITEM_BUILDS = ['effect', 'param', 'gate', 'model'];
const BUILD_COLOR = { effect: '#ff8a5c', param: '#6fb3ff', gate: '#7fd97f', model: '#c79bff' };
const ITEM_AXES = ['build', 'needs', 'where', 'design', 'status'];
const itemHas = (x, axis, v) => [].concat(x[axis]).includes(v);

function itemMatches(x, f, q) {
  // Within an axis chips OR; across axes they AND.
  for (const axis of ITEM_AXES) {
    if (f[axis].length && !f[axis].some(v => itemHas(x, axis, v))) return false;
  }
  if (q) {
    const hay = `${x.title} ${x.category} ${x.notes} ${x.where.join(' ')} ${x.needs.join(' ')}`.toLowerCase();
    if (!q.split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}

function itemCard(x) {
  const build = x.build.map(b => `<span class="badge" style="color:${BUILD_COLOR[b] || 'inherit'}">${b}</span>`).join(' ');
  return `<div class="pcard scard" style="overflow:hidden">
      ${x.thumb ? `<img class="thumb" src="${x.thumb}" alt="" loading="lazy">` : ''}
      <div class="ph">
        <span class="pt">${esc(x.title)}</span>
        <span class="st" style="color:${SOUND_COLOR[x.status]}">${x.status}</span>
        <span class="muted">${esc(x.design)}</span>
        ${build}
      </div>
      <div class="pm">${x.where.length ? `<b>where</b> ${esc(x.where.join(', '))}` : ''}${x.needs.length ? ` · <b>needs</b> ${esc(x.needs.join(', '))}` : ''}</div>
      ${x.notes ? `<details><summary>what</summary><div class="body">${md(x.notes)}</div></details>` : ''}
    </div>`;
}

function viewItems() {
  const all = ITEMS.items;
  const f = readFilters('items');
  const q = document.getElementById('search').value.trim().toLowerCase();
  const shown = all.filter(x => itemMatches(x, f, q));
  const n = (axis, v) => all.filter(x => itemHas(x, axis, v) && itemMatches(x, { ...f, [axis]: [] }, q)).length;
  const vals = (key) => [...new Set(all.flatMap(x => [].concat(x[key])).filter(Boolean))];
  const row = (label, axis, values, colors = {}) => `<div class="frow"><span class="flabel">${label}</span>
        ${values.map(v => chip(axis, v, f[axis].includes(v), n(axis, v), colors[v])).join('')}</div>`;

  const cats = [...new Set(all.map(x => x.category))];
  const sections = cats.map(cat => {
    const mine = all.filter(x => x.category === cat && x.status !== 'cut');
    const rows = shown.filter(x => x.category === cat);
    if (!rows.length) return '';
    const done = mine.filter(x => x.status === 'shipped').length;
    return `<h2 class="sec grp">${cat} <span class="muted">${done} / ${mine.length} shipped</span></h2>${rows.map(itemCard).join('')}`;
  }).join('');

  return `
    ${warnTable(ITEMS.warnings)}
    ${ITEMS.guide ? `<details class="guide"><summary>How to read</summary><div class="body">${md(ITEMS.guide)}</div></details>` : ''}
    <div class="filters">
      ${row('Build', 'build', ITEM_BUILDS, BUILD_COLOR)}
      ${row('Needs', 'needs', vals('needs'))}
      ${row('Where', 'where', vals('where'))}
      ${row('Design', 'design', vals('design'))}
      ${row('Status', 'status', ITEM_STATUSES, SOUND_COLOR)}
    </div>
    <div class="count">${shown.length} of ${all.length} items${q ? ` matching “${esc(q)}”` : ''}
      · from <a class="pathref" href="vscode://file${STATS.root}/${ITEMS.file}">${ITEMS.file}</a></div>
    ${sections || '<ul class="list"><li><span class="tblurb">nothing matches</span></li></ul>'}`;
}

/* ─────────────────────────── router ─────────────────────────── */
function render() {
  const path = location.hash.split('?')[0] || '#/tickets';
  const app = document.getElementById('app');
  const search = document.getElementById('search');

  let page = 'tickets';
  if (path.startsWith('#/t/')) { app.innerHTML = viewTicket(decodeURIComponent(path.slice(4))); page = 'tickets'; }
  else if (path === '#/stats') { app.innerHTML = viewStats(); page = 'stats'; }
  else if (path === '#/cargo') { app.innerHTML = viewCargo(); page = 'cargo'; }
  else if (path === '#/places') { app.innerHTML = viewPlaces(); page = 'places'; }
  else if (path === '#/sounds') { app.innerHTML = viewSounds(); page = 'sounds'; }
  else if (path === '#/items') { app.innerHTML = viewItems(); page = 'items'; }
  else app.innerHTML = viewTickets();

  search.style.visibility = page === 'stats' || page === 'places' ? 'hidden' : 'visible';
  for (const a of document.querySelectorAll('nav a')) a.classList.toggle('on', a.dataset.nav === page);
  if (!path.startsWith('#/t/')) window.scrollTo(0, 0);
}

document.getElementById('app').addEventListener('click', (e) => {
  const c = e.target.closest('.chip');
  if (c) toggle(c.dataset.kind, c.dataset.val);
  const p = e.target.closest('[data-play]');
  if (p) playHook(p.dataset.play).catch(err => alert(`play failed: ${err.message}`));
});
// Drag-and-drop a recording onto a sound card → wip/audio/<slug>/.
for (const [ev, fn] of Object.entries({
  dragover: (e, card) => { e.preventDefault(); card.classList.add('drag'); },
  dragleave: (e, card) => card.classList.remove('drag'),
  drop: (e, card) => { e.preventDefault(); card.classList.remove('drag'); uploadTakes(card.dataset.slug, [...e.dataTransfer.files]); },
})) {
  document.getElementById('app').addEventListener(ev, (e) => {
    const card = e.target.closest('.scard');
    if (card) fn(e, card);
  });
}
document.getElementById('search').addEventListener('input', () => {
  if (location.hash.startsWith('#/t/')) location.hash = '#/tickets';
  else render();
});
document.getElementById('reindex').addEventListener('click', async (e) => {
  e.target.textContent = 'Reindexing…';
  try { await fetch('/reindex'); await load(); render(); } finally { e.target.textContent = 'Reindex'; }
});
addEventListener('hashchange', render);
addEventListener('keydown', (e) => {
  if (e.key === '/' && e.target.tagName !== 'INPUT') { e.preventDefault(); document.getElementById('search').focus(); }
  if (e.key === 'Escape') { document.getElementById('search').value = ''; render(); }
});

await load();
if (!location.hash) location.hash = '#/tickets';
render();
</script>
</body>
